name: Check hosted runner availability (no AI)
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [careers]
        default: careers
permissions:
  contents: read
jobs:
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Verify runner starts without using secrets or inference
        run: node --version
