name: Publish Chichi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Configure public AI endpoint
        env:
          CHICHI_API_URL: ${{ vars.CHICHI_API_URL }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const value=process.env.CHICHI_API_URL || '';
          if(value && new URL(value).protocol !== 'https:') throw Error('CHICHI_API_URL must use HTTPS');
          writeFileSync('public/config.js', 'export const apiBase = '+JSON.stringify(value)+';\n');
          JS
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
